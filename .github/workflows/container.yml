name: Hunyuan container

on:
  push:
    branches: [main, 'codex/docker-paint']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: photo-to-3d
          push: true
          tags: ghcr.io/lenuar23/3d-model_generator:${{ github.ref_name == 'main' && 'latest' || 'paint' }}
