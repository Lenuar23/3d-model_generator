[project]
name = "3d-model-soft"
version = "0.1.0"
description = "Single-photo 3D generation with Hunyuan3D"
readme = "README.md"
authors = [
    { name = "youngboy21178", email = "maksym.melnyk.o.2007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.optional-dependencies]
ui = [
    "gradio==6.31.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
